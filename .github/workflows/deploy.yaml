name: Deploy of algotrading to main /home/ubuntu/mycrystal

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Deploy to Server (Optimized)
        env:
          PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          HOSTNAME: mycrystals.quantbots.co
          USER_NAME: ubuntu
          TARGET_DIR: /home/ubuntu/mycrystal
        run: |
          # 1. Setup SSH Key
          if [ -z "$PRIVATE_KEY" ]; then
            echo "Error: SSH_PRIVATE_KEY secret is not set in GitHub Secrets."
            exit 1
          fi
          echo "$PRIVATE_KEY" > private_key && chmod 600 private_key
          
          # 2. Optimized Sync (Directly from runner to target)
          # This only syncs changed files and skips intermediate folders
          echo "Syncing changed files..."
          rsync -avz -e "ssh -i private_key -o StrictHostKeyChecking=no" \
            --exclude='.git/' \
            --exclude='venv/' \
            --exclude='logs/' \
            --exclude='__pycache__/' \
            --exclude='*.pyc' \
            --exclude='qdrant_debug.log' \
            --exclude='gunicorn*.log' \
            --exclude='gunicorn.pid' \
            --exclude='.qodo/' \
            --exclude='debug_*.py' \
            --exclude='test_*.py' \
            --exclude='temp_*.py' \
            --exclude='performance_test.py' \
            --exclude='fix_*.py' \
            --exclude='staticfiles/' \
            ./ ${USER_NAME}@${HOSTNAME}:${TARGET_DIR}/
          
            # 3. Remote Commands (Permissions, Migrations, Restarts)
            ssh -o StrictHostKeyChecking=no ${USER_NAME}@${HOSTNAME} << 'EOF'
              cd /home/ubuntu/mycrystal
              chmod +x runmycrystal.sh
              source venv/bin/activate
              python manage.py migrate
              echo "Restarting services..."
            pm2 restart runmycrystal
            echo "Deployment completed successfully!"
          EOF